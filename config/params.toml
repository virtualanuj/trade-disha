# TradeDisha starting parameters. A database with no saved config takes version 1 from
# this file; after that the config is edited and versioned in the app (the Config button)
# and this file is not read again. Unknown keys are errors, so typos surface immediately.
#
# Units: percentages are percent (30 = 30 %), times are IST "HH:MM", durations are
# minutes unless the key says seconds, prices are rupees, index moves are index points.

[weights]                      # share of the bias each evidence group carries; must sum to 1
trend = 0.40
oi = 0.35
premium = 0.25
expiry_oi_weight_factor = 0.5  # on expiry day the OI weight is multiplied by this
macro = 0.10                   # share of the bias for the macro group; the three above keep their proportions in the rest

[bias]
entry_threshold = 0.50         # |bias| at which a signal fires (entry_mode = "minute_close")
setup_threshold = 0.35         # |bias| that sets up a signal, waiting for order flow (entry_mode = "trigger")
neutral_band = 0.20            # |bias| below this is labelled Neutral
rearm_hysteresis = 0.0         # 0 = off; >0 requires |bias| to dip below threshold-h before same-direction re-fire

[trend]
ema_fast = 9
ema_slow = 21
ema_k = 8.0                    # tanh steepness on EMA separation (% of slow EMA)
vwap_full_pct = 0.3            # distance from VWAP (%) that counts as full strength
supertrend_period = 10
supertrend_mult = 3.0
supertrend_ramp_bars = 3       # bars after a flip until the supertrend vote is full strength

[oi]
pcr_strike_range = 5           # strikes each side of ATM used for PCR
pcr_centre = 1.0               # PCR considered neutral
pcr_full_dev = 0.5             # PCR distance from centre that counts as full strength
oi_change_strike_range = 2     # strikes each side of ATM for the build-up vote
maxpain_drift_minutes = 15
maxpain_full_steps = 2.0       # max-pain drift (in strike steps) that counts as full strength

[premium]
premium_roc_minutes = 5
premium_roc_full_spread = 20.0 # CE minus PE rate-of-change spread (%) for full strength
iv_change_minutes = 15
iv_full_change = 2.0           # IV change (percentage points) for full strength
confirmation_minutes = 5
divergence_score = -0.5        # vote when premiums disagree with the spot move

[flow]                         # order-flow score, -1 (selling) to +1 (buying); starting values, to be tuned on shadow data
window_seconds = 15.0          # smoothing window for book imbalance and signed trades
trigger_score = 0.25           # flow score, in the setup's direction, needed to fire
hold_seconds = 5.0             # how long the score must stay there
w_fut_book = 0.4               # mix of the three parts; must sum to 1
w_fut_trades = 0.3
w_options = 0.3                # ATM call flow minus ATM put flow

[signal]
entry_mode = "minute_close"    # "minute_close" = fire at minute close on entry_threshold; "trigger" = setup then order flow. The other rule runs in shadow.
max_spread_pct = 1.0           # trigger mode: widest bid-ask spread (% of mid) at which a signal may fire
signal_ttl_seconds = 300
target_pct = 30.0
stop_pct = -15.0
outcome_horizon_minutes = 30   # how long each signal's option is followed to score it
last_signal_time = "15:00"
last_signal_time_expiry = "13:00"

[signal.expiry_points.NIFTY]
target = 40
stop = 20

[signal.expiry_points.BANKNIFTY]
target = 100
stop = 50

[chain]
strike_window = 10
recenter_strikes = 2

[paper]
square_off_time = "15:15"
cost_per_trade = 60.0          # rupees per round trip per lot
lots = 1

[bullion]                      # MCX GOLD / SILVER near-month futures, long or short (spec §9a)
signals = "on"
entry_threshold = 0.60
neutral_band = 0.20
rearm_hysteresis = 0.0
signal_ttl_seconds = 300
eval_offset_seconds = 20       # run bullion bias and signals this long after each minute close
first_signal_time = "09:15"
last_signal_time = "22:45"
square_off_time = "23:00"
target_pct = 0.40              # % of the future's price
stop_pct = 0.20
lots = 1
cost_fixed_per_lot = 60.0      # rupees per round trip per lot
cost_pct_of_value = 0.012      # % of round-trip turnover (CTT, exchange, stamp, GST)
macro_weight = 0.10            # share of the bias for other markets: the dollar and the other metal (E12, E13)
oi_weight = 0.15               # share for the future's open-interest build-up (E13); trend has the rest
flow_weight = 0.15             # share for order flow: net traded volume and the book's lean (E13)
oi_window_minutes = 15         # price and OI changes are read over this many minutes
oi_full_pct = 0.50             # OI change (%) that counts as full strength
oi_price_flat_pct = 0.02       # a smaller price move (%) is flat: no build-up
oi_unwind_factor = 0.5         # falling OI (covering, unwinding) counts this much of new positions
flow_window_minutes = 15       # minutes of signed traded volume behind the net-volume vote
flow_trades_full = 0.50        # net volume as a share of traded volume that is full strength
flow_book_minutes = 30         # the book's lean now is read against its average over this
flow_book_full = 0.20          # lean above that average (on -1..+1) that is full strength

[news]                         # the Headlines panel; display only, never an input to a signal
poll_seconds = 180             # seconds between asks to Upstox while logged in; applies at once

[macro]                        # dollar, USD/INR, crude, gold: each one's move over a window (spec §8.6)
window_minutes = 30            # minutes over which each move is measured
max_age_seconds = 180          # a price older than this is not live and carries no weight
dollar_full_pct = 0.15         # dollar-index proxy move (%) that counts as full strength
usdinr_full_pct = 0.10
crude_full_pct = 0.80
gold_full_pct = 0.40
