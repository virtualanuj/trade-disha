[project]
name = "tradedisha"
version = "0.1.0"
description = "Buy/sell signal and paper-trading assistant for NSE index options"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "websockets>=17.4",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "hypothesis>=6.170.15",
    "grpcio-tools>=1.85.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradedisha"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["tradedisha/feed/upstox_proto"]  # generated by protoc

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF", "ANN", "ASYNC", "T20", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["tradedisha"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["tradedisha", "tests"]
exclude = ['tradedisha/feed/upstox_proto/']  # generated by protoc

[[tool.mypy.overrides]]
module = "tradedisha.feed.upstox_proto.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[project.scripts]
tradedisha = "tradedisha.main:run"
